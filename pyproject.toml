[tool.poetry]
name = "iep flat calculator"
version = "0.1.0"
description = "iep flat calculator"
authors = ["fokinikita <fokinikita@gmail.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.1"
jupyter = "^1.1.1"
ipykernel = "^7.2.0"
polars = "^1.39.0"
catboost = "^1.2.10"
black = "^26.3.1"
ruff = "^0.15.6"
isort = "^8.0.1"
shapely = "^2.1.2"
pyarrow = "^23.0.1"
httpx = "^0.28.1"
uvicorn = "^0.45.0"
fastapi = "^0.136.0"
scikit-learn = "^1.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
